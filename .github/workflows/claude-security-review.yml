name: Claude Security Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security:
    # GitHub does not give secrets to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write # Necessary to post the findings as PR comments
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      # The Action has no release tags. This is the commit of `main` on 2026-02-11.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          # This Action accepts an API key only, not CLAUDE_CODE_OAUTH_TOKEN.
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Action installs Claude Code 2.1.197 (Node 18), which rejects
          # claude-opus-5-5. See anthropics/claude-code-security-review#152.
          claude-model: claude-opus-5
          # Scan each push, not only the first run for the PR.
          run-every-commit: true
      # The Action only warns when the scan fails, and the check stays green.
      - name: Fail if the scan did not complete
        run: |
          f="$GITHUB_WORKSPACE/claudecode-results.json"
          if [ ! -s "$f" ] || ! jq -e . "$f" > /dev/null 2>&1 || jq -e '.error' "$f" > /dev/null 2>&1; then
            echo "::error::The security scan did not complete. Read the log of the scan step."
            exit 1
          fi
          exclude-directories: public
